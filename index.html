<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SAS&reg; Visual Analytics SDK</title>
    <script async src='https://cdn.developer.sas.com/packages/va-report-components/latest/dist/umd/va-report-components.js'></script>
    <style>
      body {margin: 0px; padding: 0px;}
      sas-report,
      sas-report-page,
      sas-report-object {width: 100vw; height: 100vh;}
    </style>
  </head>
  <body role='main'>
    <sas-report packageUri='.'></sas-report>
  </body>
  <script>
    window.addEventListener('vaReportComponents.loaded', () => {
      vaReportComponents.setLocale('en_GB');
      vaReportComponents.setFormatterLocale('en_GB');
    });
  </script>
</html>
